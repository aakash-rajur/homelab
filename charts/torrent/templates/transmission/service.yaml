---
apiVersion: v1
kind: Service
metadata:
  name: transmission
  labels:
    app.kubernetes.io/app: transmission
    {{- include "torrent.labels" . | nindent 4 }}
spec:
  type: {{ .Values.transmission.service.type }}
  ports:
    - port: {{ .Values.transmission.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/app: transmission
    {{- include "torrent.selectorLabels" . | nindent 4 }}
{{- if .Values.gateway.name }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: transmission
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
  hostnames:
    - "transmission.{{ .Values.rootDomain }}"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: transmission
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
{{- end }}
