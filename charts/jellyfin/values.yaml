rootDomain: ""
gateway:
  name: ""
  namespace: ""

jellyfin:
  image:
    repository: jellyfin/jellyfin
    pullPolicy: IfNotPresent
    tag: "10.11.11"
  workingDir: /home/jellyfin
  timezone: Etc/UTC
  replicaCount: 1
  resources: {}
  service:
    type: ClusterIP
    port: 80
    appPort: 8096
  healthcheck:
    livenessProbe:
      httpGet:
        path: /health
        port: 8096
    readinessProbe:
      httpGet:
        path: /health
        port: 8096
  securityContext: {}
  volumes: []
  volumeMounts: []

jellyseerr:
  image:
    repository: ghcr.io/seerr-team/seerr
    pullPolicy: IfNotPresent
    tag: "v3.4.1"
  workingDir: /home/jellyseerr
  timezone: Etc/UTC
  replicaCount: 1
  resources: {}
  service:
    type: ClusterIP
    port: 80
    appPort: 5055
  healthcheck:
    livenessProbe:
      exec:
        command:
          - "wget"
          - "--no-verbose"
          - "--tries=1"
          - "--spider"
          - "http://localhost:5055/api/v1/status"
    readinessProbe:
      exec:
        command:
          - "wget"
          - "--no-verbose"
          - "--tries=1"
          - "--spider"
          - "http://localhost:5055/api/v1/status"
  securityContext: {}
  volumes: []
  volumeMounts: []

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

nodeSelector: {}

tolerations: []

affinity: {}
