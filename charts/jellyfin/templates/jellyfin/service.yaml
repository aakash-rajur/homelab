---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  labels:
    app.kubernetes.io/app: jellyfin
    {{- include "jellyfin.labels" . | nindent 4 }}
spec:
  type: {{ .Values.jellyfin.service.type }}
  ports:
    - port: {{ .Values.jellyfin.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/app: jellyfin
    {{- include "jellyfin.selectorLabels" . | nindent 4 }}
{{- if .Values.gateway.name }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
  hostnames:
    - "jellyfin.{{ .Values.rootDomain }}"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: jellyfin
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: "0s"
{{- end }}
