---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: pool-172
  namespace: metallb-system
spec:
  addresses:
  - 172.16.0.0/12
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: l2-advertisement
  namespace: metallb-system
spec:
  interfaces:
    - "0.0.0.0"
  ipAddressPools:
    - pool-172