- name: Install apps
  block:
    - name: Load torrent client env
      import_tasks: "common/read_env.yml"
      vars:
        path: "../apps/torrent/.envrc"
    - name: Configure torrent
      kubernetes.core.k8s:
        context: "archlinux"
        template:
          - path: "../apps/torrent/config.yaml"
        state: present
      delegate_to: localhost
    - name: Install torrent clients
      kubernetes.core.helm:
        context: "archlinux"
        name: "torrent"
        chart_ref: "../charts/torrent"
        release_namespace: torrent
        values_files:
          - "../apps/torrent/values.yaml"
      delegate_to: localhost
    - name: Configure servarr
      kubernetes.core.k8s:
        context: "archlinux"
        template:
          - path: "../apps/servarr/config.yaml"
        state: present
      delegate_to: localhost
    - name: Install servarr
      kubernetes.core.helm:
        context: "archlinux"
        name: "servarr"
        chart_ref: "../charts/servarr"
        release_namespace: servarr
        values_files:
          - "../apps/servarr/values.yaml"
      delegate_to: localhost
    - name: Configure jellyfin
      kubernetes.core.k8s:
        context: "archlinux"
        template:
          - path: "../apps/jellyfin/config.yaml"
        state: present
      delegate_to: localhost
    - name: Install jellyfin
      kubernetes.core.helm:
        context: "archlinux"
        name: "jellyfin"
        chart_ref: "../charts/jellyfin"
        release_namespace: jellyfin
        values_files:
          - "../apps/jellyfin/values.yaml"
      delegate_to: localhost
    - name: Load keel env
      import_tasks: "common/read_env.yml"
      vars:
        path: "../apps/keel/.envrc"
    - name: Configure and install keel
      kubernetes.core.k8s:
        context: "archlinux"
        template:
          - path: "../apps/keel/config.yaml"
          - path: "../apps/keel/install.yaml"
        state: present
      delegate_to: localhost
