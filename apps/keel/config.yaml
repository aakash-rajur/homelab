---
apiVersion: v1
kind: Namespace
metadata:
  name: keel
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: keel-credentials
  namespace: keel
spec:
  encryptedData:
    PASSWORD: 
    USERNAME: 
  template:
    metadata:
      creationTimestamp: null
      name: keel-credentials
      namespace: keel
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keel
  namespace: keel
spec:
  parentRefs:
    - name: primary-gateway
      namespace: envoy-gateway-system
  hostnames:
    - "keel.dexterslab.cc"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: keel
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /