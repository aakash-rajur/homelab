---
apiVersion: v1
kind: Namespace
metadata:
  name: pihole
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: pihole-secrets
  namespace: pihole
spec:
  encryptedData:
    PASSWORD: 
  template:
    metadata:
      creationTimestamp: null
      name: pihole-secrets
      namespace: pihole
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pihole-web
  namespace: pihole
spec:
  parentRefs:
    - name: primary-gateway
      namespace: envoy-gateway-system
  hostnames:
    - "pihole.dexterslab.cc"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: pihole-web
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
---
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: pihold-dns-tcp
  namespace: pihole
spec:
  parentRefs:
    - name: primary-gateway
      namespace: envoy-gateway-system
  rules:
    - backendRefs:
        - name: pihole-dns
          kind: Service
          port: 53
---
apiVersion: gateway.networking.k8s.io/v1
kind: UDPRoute
metadata:
  name: pihold-dns-udp
  namespace: pihole
spec:
  parentRefs:
    - name: primary-gateway
      namespace: envoy-gateway-system
  rules:
    - backendRefs:
        - name: pihole-dns
          kind: Service
          port: 53